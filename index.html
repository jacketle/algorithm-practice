document.getElementById('show').addEventListener('change',e=>document.getElementById('password').type=e.target.checked?'text':'password');
document.getElementById('unlock').addEventListener('submit',async e=>{
 e.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');
 if(!window.crypto?.subtle){error.textContent='请通过HTTPS网址，用Safari、Chrome或Edge浏览器打开。';return;}
 button.disabled=true;button.textContent='正在解锁…';error.textContent='';
 try{
  const p=JSON.parse(document.getElementById('encrypted-data').textContent),decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const password=document.getElementById('password').value.trim();
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(p.salt),iterations:p.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(p.iv),tagLength:128},key,decode(p.data));
  document.getElementById('password').value='';
  document.open();document.write(new TextDecoder().decode(plain));document.close();
 }catch(_){error.textContent='未能解锁，请检查密码是否完整、大小写是否一致。';button.disabled=false;button.textContent='解锁并开始练习';}
});
</script></body></html>
